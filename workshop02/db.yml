---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bggdb-database
  namespace: bggns
spec:
  replicas: 1
  selector:
    matchLabels:
      pod-type: db
  template:
    metadata:
      labels:
        pod-type: db
    spec:
      containers:
      - name: bggdb-database
        image: stackupiss/bgg-database:v1
        imagePullPolicy: IfNotPresent
        ports:
        - name: db-port
          containerPort: 3306
          hostPort: 3306

---
apiVersion: v1
kind: Service
metadata:
  name: bggdb-svc
  namespace: bggns
spec:
  type: ClusterIP
  selector:
    pod-type: db
  ports:
    - name: db-port
      port: 3306
      targetPort: 3306


---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bggapp-config
  namespace: bggns
data:
  BGG_DB_HOST: bggdb-svc.bggns.svc.cluster.local
  BGG_DB_USER: root
---

apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: bggns
data:
  BGG_DB_PASSWORD: Y2hhbmdlaXQ=


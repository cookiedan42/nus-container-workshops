---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bggapp-deploy
  namespace: bggns
spec:
  replicas: 3
  selector:
    matchLabels:
      pod-type: app
  template:
    metadata:
      labels:
        pod-type: app
        version: 1
    spec:
      containers:
      - name: bggapp-deploy
        image: stackupiss/bgg-backend:v1
        imagePullPolicy: IfNotPresent
        envFrom:
          - configMapRef:
              name:  bggapp-config
          - secretRef:
              name: app-secret
        ports:
        - name: app-port
          containerPort: 3000
        livenessProbe:
          httpGet:
            path: /healthz
            port: app-port
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1

---
apiVersion: v1
kind: Service
metadata:
  name: bggapp-svc
  namespace: bggns
spec:
  # type: ClusterIP # requires port forwarding to test from web browser  
  type: LoadBalancer
  selector:
    pod-type: app
  ports:
    - name: app-port
      port: 3000
      targetPort: 3000